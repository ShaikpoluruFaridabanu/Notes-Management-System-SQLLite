{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 col-xxl-4">
  <div class="card shadow-sm"><div class="card-body p-3 p-sm-4">
    <h4 class="mb-3">Reset password</h4>
    <form method="post">
      <div class="mb-3"><label class="form-label">Username</label><input name="username" class="form-control" autocomplete="username" autocapitalize="none" spellcheck="false" required></div>
      <div class="mb-3"><label class="form-label">Registered email</label><input type="email" inputmode="email" autocomplete="email" name="email" class="form-control" required></div>
      <div class="mb-3"><label class="form-label">New password</label><input type="password" name="new_password" autocomplete="new-password" class="form-control" required></div>
      <button class="btn btn-primary btn-lg w-100">Update password</button>
    </form>
    <p class="mt-3 mb-0 text-center auth-links"><a href="{{ url_for('login') }}">Back to login</a></p>
  </div></div>
</div></div>
{% endblock %}
